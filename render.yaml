services:
  - type: web
    name: laboura-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROCESS_ROLE
        value: web
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "15m"
      - key: STAFF_BOOTSTRAP_SECRET
        generateValue: true
      - key: OTP_PROVIDER_MODE
        value: mock
      - key: PAYMENT_PROVIDER_MODE
        value: mock
      - key: WHATSAPP_PROVIDER_MODE
        value: mock
      - key: TELEPHONY_PROVIDER_MODE
        value: mock
      - key: KYC_PROVIDER_MODE
        value: mock
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: TELEPHONY_API_KEY
        sync: false
      - key: TELEPHONY_VENDOR
        sync: false
      - key: TOLL_FREE_NUMBER
        sync: false
      - key: KYC_API_KEY
        sync: false
      - key: KYC_API_URL
        sync: false
      - key: CLOUDFLARE_ACCESS_ENFORCED
        value: "false"
      - key: CLOUDFLARE_ACCESS_TEAM_DOMAIN
        sync: false
      - key: CLOUDFLARE_ACCESS_AUD
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: COMPANY_LEGAL_NAME
        value: "Laboura Private Limited"
      - key: COMPANY_GSTIN
        sync: false
      - key: COMPANY_ADDRESS
        value: "Bengaluru, Karnataka, India"

  - type: worker
    name: laboura-worker
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROCESS_ROLE
        value: worker
      - key: DATABASE_URL
        fromService:
          type: web
          name: laboura-api
          envVarKey: DATABASE_URL
      - key: REDIS_HOST
        fromService:
          type: web
          name: laboura-api
          envVarKey: REDIS_HOST
      - key: REDIS_PORT
        fromService:
          type: web
          name: laboura-api
          envVarKey: REDIS_PORT
      - key: REDIS_PASSWORD
        fromService:
          type: web
          name: laboura-api
          envVarKey: REDIS_PASSWORD
      - key: REDIS_TLS
        fromService:
          type: web
          name: laboura-api
          envVarKey: REDIS_TLS
      - key: JWT_SECRET
        fromService:
          type: web
          name: laboura-api
          envVarKey: JWT_SECRET
      - key: OTP_PROVIDER_MODE
        value: mock
      - key: PAYMENT_PROVIDER_MODE
        value: mock
      - key: WHATSAPP_PROVIDER_MODE
        value: mock
      - key: TELEPHONY_PROVIDER_MODE
        value: mock
      - key: KYC_PROVIDER_MODE
        value: mock
      - key: ALERT_WEBHOOK_URL
        fromService:
          type: web
          name: laboura-api
          envVarKey: ALERT_WEBHOOK_URL
