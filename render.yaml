# Laboura on Render. DEPLOY.md explains every step in the dashboard.
#
# Three services, all in Singapore next to the Supabase project:
#   laboura-api    web service: API, webhooks and the staff consoles
#   laboura-worker background worker: every scheduled job (BullMQ)
#   laboura-redis  Render Key Value (Redis) for the job queue, private network only
#
# Database and uploaded files live in Supabase (see DEPLOY.md, Step 1).
#
# Values written here (value: ...) are put back every time Render syncs this
# file. Values marked `sync: false` are asked for once, when the blueprint is
# first created, and after that are changed only in the dashboard.
#
# THIS IS THE LIVE BLUEPRINT (LABOURA_SETUP=live, INF-3). It does not start
# with pretend vendors: the OTP, SMS and payment vendors and the human check are
# asked for (sync: false) and must name the real ones; the service refuses to
# start on `mock`, on OTP test mode or on the customer OTP test mode.
# DEPLOY.md, "What to set before going live", lists every value. For a test
# copy with made-up data use render.free.yaml (LABOURA_SETUP=test).

services:
  - type: web
    name: laboura-api
    runtime: node
    plan: starter
    region: singapore
    # NODE_ENV=production is visible while building, which would make a plain
    # `npm install` skip devDependencies (Nest CLI, TypeScript, Prisma) and the
    # build would fail. --include=dev keeps them; prisma generate builds the
    # database client from the pinned Prisma version.
    #
    # WEB APP BUILD STEP GOES HERE: when the web/ app is added, append its build
    # to the end of this line, e.g. `... && npm run build && npm run build:web`.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Runs the pinned Prisma from node_modules (never downloads a newer one).
    preDeployCommand: npm run migrate:deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Aadhaar QR check: the SHA-256 fingerprints of the UIDAI certificates in
      # src/modules/aadhaar-qr/certs, comma-separated, AFTER comparing each with
      # UIDAI's own page (DEPLOY.md, go-live check). The service refuses to start
      # until this matches the certificates in the code (not needed with LABOURA_SETUP=test).
      - key: UIDAI_CERT_FINGERPRINTS
        sync: false
      - key: PROCESS_ROLE
        value: web
      # 1 = Render's own proxy. Use 2 once Cloudflare sits in front of Render.
      - key: TRUST_PROXY_HOPS
        value: "1"

      # --- Database (Supabase) ---
      # Transaction pooler, port 6543:
      #   ...pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=5&sslmode=require
      - key: DATABASE_URL
        sync: false
      # Session pooler, port 5432 (used only to run migrations):
      #   ...pooler.supabase.com:5432/postgres?sslmode=require
      - key: DIRECT_URL
        sync: false

      # --- Job queue (Render Key Value, private network: plain connection, no password) ---
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: laboura-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: laboura-redis
          property: port
      - key: REDIS_TLS
        value: "false"
      # /health/ready answers 503 naming `worker` when the worker stops.
      - key: WORKER_HEARTBEAT_CHECK
        value: "true"

      # --- Secrets Render generates (never type these) ---
      - key: JWT_SECRET
        generateValue: true
      - key: LOGIN_CODE_SECRET
        generateValue: true
      - key: STAFF_BOOTSTRAP_SECRET
        generateValue: true
      - key: CALL_ROUTING_KEY
        generateValue: true
      - key: PAYOUT_ACCOUNT_KEY
        generateValue: true
      # Keys the phone and ID hashes of permanent bans (D11).
      - key: PERMANENT_BAN_HASH_KEY
        generateValue: true
      # Customer app sign-in (separate realm): signs customer tokens; never the staff JWT_SECRET.
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      # Customer app "Continue with Google": the OAuth client ids from the Laboura
      # Firebase / Google Cloud project (Android, iPhone, web). Not secret, but
      # asked for once; leave all three empty to keep Google sign-in off.
      - key: GOOGLE_CLIENT_ID_ANDROID
        sync: false
      - key: GOOGLE_CLIENT_ID_IOS
        sync: false
      - key: GOOGLE_CLIENT_ID_WEB
        sync: false
      # Customer app "Sign in with Apple" (iPhone app; Apple rule 4.8): the app's
      # bundle id and the web Services ID. Empty = Apple sign-in off (refused).
      - key: APPLE_CLIENT_ID_IOS
        sync: false
      - key: APPLE_CLIENT_ID_WEB
        sync: false
      # Customer OTP abuse protection (INF-4): system-wide codes per 24 hours;
      # above it every code needs the human check and an alert goes out.
      - key: CUSTOMER_OTP_DAILY_LIMIT
        value: "3000"
      # Different numbers one internet address may ask codes for in an hour
      # before the human check is asked for.
      - key: CUSTOMER_OTP_ADDRESS_PHONES_BEFORE_CHECK
        value: "3"
      # The human check (CAPTCHA, Play Integrity / App Attest). Asked once: it must
      # name the real provider; `mock` (or empty) is refused at start-up on live.
      - key: HUMAN_CHECK_PROVIDER_MODE
        sync: false
      # This blueprint is the live setup. The server refuses to start unless
      # LABOURA_SETUP is exactly live or test, and on live with any mock vendor.
      - key: LABOURA_SETUP
        value: live
      # Customer app OTP codes shown on screen: off (refused on live).
      - key: CUSTOMER_OTP_TEST_MODE
        value: "off"
      # Staff OTP test mode: off (refused on live).
      - key: OTP_TEST_MODE
        value: "off"
      - key: JWT_EXPIRES_IN
        value: "15m"

      # --- Must be filled before the first start (the server refuses to start without it) ---
      # The address every SMS / WhatsApp link points at (invites, resets, /p/...):
      # https://app.laboura.com once DEPLOY.md, "Connect laboura.com at Hostinger",
      # is done; until then the onrender.com address Render shows.
      - key: PUBLIC_APP_URL
        sync: false
      # The address that opens Laboura Field at its root: field.laboura.com
      # (empty until it is connected; Laboura Field is always at /field too).
      - key: FIELD_HOST
        sync: false

      # --- Uploaded files (Supabase Storage). Production refuses to start otherwise. ---
      # Job seeker and referral partner selfies and staff photos (private candidate-photos bucket).
      - key: CANDIDATE_PHOTO_STORAGE_MODE
        value: supabase
      - key: BUSINESS_PHOTO_STORAGE_MODE
        value: supabase
      - key: AGREEMENT_STORAGE_MODE
        value: supabase
      - key: RECORDING_STORAGE_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Call recordings are copied only from these hosts (IN-4): the calling
      # vendor's recording host(s), comma-separated, e.g. recordings.vendor.com
      # or *.vendor-cdn.com. Empty = no recording is ever fetched.
      - key: RECORDING_URL_HOSTS
        sync: false

      # --- Company details ---
      - key: COMPANY_UPI_VPA
        sync: false
      - key: COMPANY_UPI_PAYEE_NAME
        sync: false
      - key: COMPANY_LEGAL_NAME
        sync: false
      - key: COMPANY_GSTIN
        sync: false
      - key: COMPANY_ADDRESS
        value: "Bengaluru, Karnataka, India"

      # --- Access and alerts ---
      - key: CLOUDFLARE_ACCESS_ENFORCED
        value: "false"
      - key: CLOUDFLARE_ACCESS_TEAM_DOMAIN
        sync: false
      - key: CLOUDFLARE_ACCESS_AUD
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false

      # --- Vendors (AGENTS.md section 3) ---
      # Live needs the real OTP, SMS and payment vendors (INF-3). Asked once when
      # the blueprint is created: OTP_PROVIDER_MODE real (or msg91 / dlt),
      # SMS_PROVIDER_MODE real, PAYMENT_PROVIDER_MODE real (or razorpay).
      # `mock` or empty refuses to start.
      - key: OTP_PROVIDER_MODE
        sync: false
      - key: SMS_PROVIDER_MODE
        sync: false
      - key: PAYMENT_PROVIDER_MODE
        sync: false
      # WhatsApp and calling may stay mock until those vendors are signed.
      - key: WHATSAPP_PROVIDER_MODE
        value: mock
      - key: TELEPHONY_PROVIDER_MODE
        value: mock
      # Customer app pushes (Expo push service -> Google FCM / Apple APNs). mock logs instead of sending.
      - key: CUSTOMER_PUSH_PROVIDER_MODE
        value: mock
      # Only if "enhanced push security" is switched on in the Expo account.
      - key: EXPO_ACCESS_TOKEN
        sync: false
      # SMS and OTP (MSG91 or another DLT-registered gateway)
      - key: SMS_API_KEY
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: DLT_SENDER_ID
        sync: false
      - key: DLT_TEMPLATE_ID
        sync: false
      - key: DLT_ENTITY_ID
        sync: false
      - key: SMS_DLT_TEMPLATE_IDS
        sync: false
      # WhatsApp (Meta Cloud API)
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Calling
      - key: TELEPHONY_VENDOR
        sync: false
      - key: TOLL_FREE_NUMBER
        sync: false
      # Card payments and payouts (Razorpay / RazorpayX)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      # Webhook signing secrets
      - key: BANK_FEED_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYOUT_WEBHOOK_SECRET
        sync: false
      - key: TELEPHONY_WEBHOOK_SECRET
        sync: false
      - key: MESSAGE_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: laboura-worker
    runtime: node
    plan: starter
    region: singapore
    # Same API build as the web service (`build:api`, the `nest build` that
    # `npm run build` starts with), so dist/worker.js always matches the API's
    # code; the worker needs no web/ or field/ app.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build:api
    startCommand: npm run start:worker
    # When a vendor is switched from mock to real, change its *_PROVIDER_MODE on
    # BOTH services and copy its keys to the worker with fromService like the
    # entries below: the worker sends WhatsApp and SMS messages.
    envVars:
      - key: NODE_ENV
        value: production
      # Aadhaar QR check: the SHA-256 fingerprints of the UIDAI certificates in
      # src/modules/aadhaar-qr/certs, comma-separated, AFTER comparing each with
      # UIDAI's own page (DEPLOY.md, go-live check). The service refuses to start
      # until this matches the certificates in the code (not needed with LABOURA_SETUP=test).
      - key: UIDAI_CERT_FINGERPRINTS
        sync: false
      - key: PROCESS_ROLE
        value: worker
      # Which setup this is (live here), the same as on the web service: the worker
      # refuses to start without it, checks the vendors (INF-3) and the UIDAI certificates.
      - key: LABOURA_SETUP
        fromService:
          type: web
          name: laboura-api
          envVarKey: LABOURA_SETUP
      - key: DATABASE_URL
        fromService:
          type: web
          name: laboura-api
          envVarKey: DATABASE_URL
      - key: DIRECT_URL
        fromService:
          type: web
          name: laboura-api
          envVarKey: DIRECT_URL
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: laboura-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: laboura-redis
          property: port
      - key: REDIS_TLS
        value: "false"
      - key: JWT_SECRET
        fromService:
          type: web
          name: laboura-api
          envVarKey: JWT_SECRET
      - key: LOGIN_CODE_SECRET
        fromService:
          type: web
          name: laboura-api
          envVarKey: LOGIN_CODE_SECRET
      - key: CALL_ROUTING_KEY
        fromService:
          type: web
          name: laboura-api
          envVarKey: CALL_ROUTING_KEY
      - key: PAYOUT_ACCOUNT_KEY
        fromService:
          type: web
          name: laboura-api
          envVarKey: PAYOUT_ACCOUNT_KEY
      - key: PERMANENT_BAN_HASH_KEY
        fromService:
          type: web
          name: laboura-api
          envVarKey: PERMANENT_BAN_HASH_KEY
      - key: PUBLIC_APP_URL
        fromService:
          type: web
          name: laboura-api
          envVarKey: PUBLIC_APP_URL
      # Job seeker and referral partner selfies and staff photos (private candidate-photos bucket).
      - key: CANDIDATE_PHOTO_STORAGE_MODE
        value: supabase
      - key: BUSINESS_PHOTO_STORAGE_MODE
        value: supabase
      - key: AGREEMENT_STORAGE_MODE
        value: supabase
      - key: RECORDING_STORAGE_MODE
        value: supabase
      - key: SUPABASE_URL
        fromService:
          type: web
          name: laboura-api
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: web
          name: laboura-api
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: COMPANY_UPI_VPA
        fromService:
          type: web
          name: laboura-api
          envVarKey: COMPANY_UPI_VPA
      - key: COMPANY_UPI_PAYEE_NAME
        fromService:
          type: web
          name: laboura-api
          envVarKey: COMPANY_UPI_PAYEE_NAME
      - key: ALERT_WEBHOOK_URL
        fromService:
          type: web
          name: laboura-api
          envVarKey: ALERT_WEBHOOK_URL
      # The same vendors as the web service (the worker refuses to start on live with a mock one).
      - key: OTP_PROVIDER_MODE
        fromService:
          type: web
          name: laboura-api
          envVarKey: OTP_PROVIDER_MODE
      - key: SMS_PROVIDER_MODE
        fromService:
          type: web
          name: laboura-api
          envVarKey: SMS_PROVIDER_MODE
      - key: PAYMENT_PROVIDER_MODE
        fromService:
          type: web
          name: laboura-api
          envVarKey: PAYMENT_PROVIDER_MODE
      - key: HUMAN_CHECK_PROVIDER_MODE
        fromService:
          type: web
          name: laboura-api
          envVarKey: HUMAN_CHECK_PROVIDER_MODE
      - key: OTP_TEST_MODE
        value: "off"
      - key: WHATSAPP_PROVIDER_MODE
        value: mock
      - key: TELEPHONY_PROVIDER_MODE
        value: mock
      # Call recordings are copied by the worker too (IN-4).
      - key: RECORDING_URL_HOSTS
        fromService:
          type: web
          name: laboura-api
          envVarKey: RECORDING_URL_HOSTS
      # The worker sends the customer app pushes.
      - key: CUSTOMER_PUSH_PROVIDER_MODE
        value: mock
      - key: EXPO_ACCESS_TOKEN
        fromService:
          type: web
          name: laboura-api
          envVarKey: EXPO_ACCESS_TOKEN

  # Job queue. Paid fixed plan: the free plan's command limit runs out because
  # the worker checks the queue constantly. noeviction is required by BullMQ
  # (an evicted key is a lost job). An empty ipAllowList means only Laboura's
  # own Render services can connect, over the private network.
  - type: keyvalue
    name: laboura-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
