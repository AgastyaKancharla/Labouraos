name: Test and Lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laboura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            field/package-lock.json

      - name: Install dependencies
        run: npm ci

      # backup-restore.spec.ts shells out to pg_dump/psql; the client must be
      # at least as new as the postgres:17 service or pg_dump refuses to run.
      - name: Install PostgreSQL 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # schema.prisma reads DIRECT_URL for migrations (Supabase session
      # pooler in production). In CI it is the same local database.
      - name: Deploy database migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/laboura_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/laboura_test?schema=public"
        run: npm run migrate:deploy

      - name: Run linter
        run: npm run lint

      # The React web app (web/) has its own package.json and lockfile.
      - name: Install web app dependencies
        run: npm run web:install

      - name: Lint web app
        run: npm run web:lint

      - name: Test web app
        run: npm run web:test

      - name: Build web app
        run: npm run web:build

      # Laboura Field, the Expo phone app (field/), with its own lockfile.
      - name: Install field app dependencies
        run: npm run field:install

      - name: Lint field app
        run: npm run field:lint

      - name: Test field app
        run: npm run field:test

      - name: Build field app (installable web app)
        run: npm run field:build-web

      - name: Run tests
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/laboura_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/laboura_test?schema=public"
          JWT_SECRET: "ci_jwt_secret_testing_only_32_characters_minimum"
          LOGIN_CODE_SECRET: "ci_login_code_secret_testing_only_32_characters"
          CALL_ROUTING_KEY: "ci_call_routing_key_testing_only_32_characters"
          PAYOUT_ACCOUNT_KEY: "ci_payout_account_key_testing_only_32_characters"
          STAFF_BOOTSTRAP_SECRET: "ci_bootstrap_secret_testing_only_32_characters"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          PUBLIC_APP_URL: "https://app.laboura.in"
          COMPANY_UPI_VPA: "laboura@icici"
          COMPANY_UPI_PAYEE_NAME: "Laboura Staffing Pvt Ltd"
          BANK_FEED_WEBHOOK_SECRET: "ci_bank_feed_webhook_secret_32_characters"
          PAYMENT_WEBHOOK_SECRET: "ci_payment_webhook_secret_32_characters"
          PAYOUT_WEBHOOK_SECRET: "ci_payout_webhook_secret_32_characters"
          TELEPHONY_WEBHOOK_SECRET: "ci_telephony_webhook_secret_32_characters"
          MESSAGE_WEBHOOK_SECRET: "ci_message_webhook_secret_32_characters"
        run: npm test
